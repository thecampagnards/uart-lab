<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Wiring between an FT232RL USB-UART bridge and an HLK-LD2420 module. Of the bridge's header, only four pins are used: 3V3 to the module's 3V3, GND to GND, the bridge's TXD to the module's RX carrying commands, and the module's OT1 back to the bridge's RXD carrying measurements. The 5V pin must never be connected. RTS, CTS, DTR, DSR, DCD and RI are unused, and the module's OT2 is left unconnected.">
  <style>
    svg {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* standalone-theme:start
       Colours for when this file is viewed on its own — in a README, an editor,
       a browser tab. They follow the operating system. The app strips this block
       when it inlines the file and supplies the same variables from its own
       theme instead, so the diagram follows the in-app light/dark toggle rather
       than the OS. Keep the two sets of names in sync. */
    svg {
      color: #3f3f3f;
      --power: #c62f2f;
      --data: #1f6fd0;
      --muted: #7a7a7a;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #dcdcdc;
        --power: #e06a6a;
        --data: #5c9bec;
        --muted: #9a9a9a;
      }
    }
    /* standalone-theme:end */
    .chip { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .pin { fill: currentColor; }
    .pin-off { fill: var(--muted); }
    .pin-danger { fill: var(--power); }
    .title { fill: currentColor; font-size: 14px; font-weight: 650; }
    .sub { fill: var(--muted); font-size: 11px; }
    .pinlabel { fill: currentColor; font-size: 12.5px; }
    .pinlabel-off { fill: var(--muted); font-size: 12.5px; }
    .pinlabel-danger { fill: var(--power); font-size: 12.5px; font-weight: 650; }
    .wirelabel { font-size: 11.5px; }
    .wire { stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--data)"/>
    </marker>
  </defs>

  <!-- ===================== USB-UART bridge ===================== -->
  <rect class="chip" x="40" y="56" width="210" height="348" rx="10"/>
  <text class="title" x="40" y="42">FT232RL bridge</text>
  <text class="sub" x="40" y="424">Full breakout header. Only four pins are used;</text>
  <text class="sub" x="40" y="440">the greyed ones stay unconnected.</text>

  <!-- 5V: the pin that destroys the module -->
  <rect class="pin-danger" x="244" y="81" width="12" height="10" rx="2"/>
  <text class="pinlabel-danger" x="234" y="90" text-anchor="end">5V</text>
  <text class="sub" x="264" y="90" fill="var(--power)">never connect this to the module</text>

  <rect class="pin" x="244" y="111" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="234" y="120" text-anchor="end">3V3</text>

  <rect class="pin" x="244" y="141" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="234" y="150" text-anchor="end">GND</text>

  <rect class="pin" x="244" y="171" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="234" y="180" text-anchor="end">TXD</text>

  <rect class="pin" x="244" y="201" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="234" y="210" text-anchor="end">RXD</text>

  <rect class="pin-off" x="244" y="241" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="234" y="250" text-anchor="end">RTS</text>

  <rect class="pin-off" x="244" y="271" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="234" y="280" text-anchor="end">CTS</text>

  <rect class="pin-off" x="244" y="301" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="234" y="310" text-anchor="end">DTR</text>

  <rect class="pin-off" x="244" y="331" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="234" y="340" text-anchor="end">DSR</text>

  <rect class="pin-off" x="244" y="361" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="234" y="370" text-anchor="end">DCD</text>

  <rect class="pin-off" x="244" y="386" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="234" y="395" text-anchor="end">RI</text>

  <text class="sub" x="60" y="236">flow control and modem lines — unused</text>

  <!-- ===================== Radar module ===================== -->
  <rect class="chip" x="520" y="56" width="200" height="230" rx="10"/>
  <text class="title" x="720" y="42" text-anchor="end">HLK-LD2420</text>
  <text class="sub" x="720" y="306" text-anchor="end">connector J2 — 3.3 V part throughout</text>

  <rect class="pin" x="514" y="111" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="536" y="120">3V3</text>

  <rect class="pin" x="514" y="141" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="536" y="150">GND</text>

  <rect class="pin" x="514" y="171" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="536" y="180">RX</text>

  <rect class="pin" x="514" y="201" width="12" height="10" rx="2"/>
  <text class="pinlabel" x="536" y="210">OT1</text>

  <rect class="pin-off" x="514" y="256" width="12" height="10" rx="2"/>
  <text class="pinlabel-off" x="536" y="265">OT2</text>

  <!-- ===================== Wires ===================== -->
  <line class="wire" x1="256" y1="116" x2="514" y2="116" stroke="var(--power)"/>
  <text class="wirelabel" x="385" y="108" text-anchor="middle" fill="var(--power)">3.3 V supply</text>

  <line class="wire" x1="256" y1="146" x2="514" y2="146" stroke="currentColor"/>
  <text class="wirelabel" x="385" y="138" text-anchor="middle" fill="currentColor">common ground</text>

  <line class="wire" x1="256" y1="176" x2="510" y2="176" stroke="var(--data)" marker-end="url(#arrow-data)"/>
  <text class="wirelabel" x="385" y="168" text-anchor="middle" fill="var(--data)">commands from the browser</text>

  <line class="wire" x1="514" y1="206" x2="260" y2="206" stroke="var(--data)" marker-end="url(#arrow-data)"/>
  <text class="wirelabel" x="385" y="198" text-anchor="middle" fill="var(--data)">measurements from the module</text>

  <line class="wire" x1="514" y1="261" x2="440" y2="261" stroke="var(--muted)" stroke-dasharray="4 4"/>
  <text class="sub" x="430" y="265" text-anchor="end">optional presence output</text>

  <!-- ===================== The mistake that destroys the module ===================== -->
  <rect x="40" y="448" width="680" height="44" rx="8" fill="none" stroke="var(--power)" stroke-width="1.5"/>
  <text class="pinlabel" x="60" y="470" fill="var(--power)" font-weight="650">Set the bridge to 3.3 V before wiring.</text>
  <text class="sub" x="60" y="486" fill="var(--power)">Many FT232RL boards ship jumpered to 5 V, which destroys the module.</text>
</svg>
